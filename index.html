<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Snake Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1>Snake Game</h1>
    <div class="hud">
      <span>Score: <strong id="score">0</strong></span>
      <button id="restartBtn" type="button">Restart</button>
    </div>
    <div class="board-wrap">
      <canvas id="gameCanvas" width="400" height="400" aria-label="Snake game board"></canvas>
      <button id="startBtn" class="start-btn" type="button">Start</button>
    </div>
    <p class="tip">Use Arrow Keys or WASD to move. Press Space to pause/resume.</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
